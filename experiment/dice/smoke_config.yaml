name: dice_smoke
logger:
  level: INFO
  path: ./logs/dice_smoke.log
caching:
  path: ./cache/
dataset:
  name: german
  path: ./dataset/german/
preprocess:
- name: scale
  seed: 0
  scaling: normalize
  range: true
- name: encode
  seed: 0
  encoding: onehot
- name: split
  seed: 0
  split: 0.2
model:
  name: mlp
  seed: 0
  device: cpu
  epochs: 50
  learning_rate: 0.01
  batch_size: 32
  layers: [64, 32]
  optimizer: adam
  criterion: cross_entropy
  output_activation: softmax
method:
  name: dice
  seed: 0
  device: cpu
  total_cfs: 1
  min_iter: 50
  max_iter: 200
  init_near_query_instance: false
  respect_mutability: false
  feature_weights: inverse_mad
  posthoc_sparsity_enabled: false
  optimizer: adam
evaluation:
  - name: validity
  - name: distance
