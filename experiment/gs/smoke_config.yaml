name: gs_smoke
logger:
  level: INFO
  path: ./logs/gs_smoke.log
caching:
  path: ./cache/
dataset:
  name: german
  path: ./dataset/german/
preprocess:
- name: scale
  seed: 0
  scaling: normalize
  range: true
- name: encode
  seed: 0
  encoding: onehot
- name: split
  seed: 0
  split: 0.2
model:
  name: mlp
  seed: 0
  device: cpu
  epochs: 50
  learning_rate: 0.01
  batch_size: 32
  layers: [64, 32]
  optimizer: adam
  criterion: cross_entropy
  output_activation: softmax
method:
  name: gs
  seed: 0
  device: auto
  n_search_samples: 1000
  p_norm: 2
  max_iter: 500
evaluation:
  - name: validity
  - name: distance
