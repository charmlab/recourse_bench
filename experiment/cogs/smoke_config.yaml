name: cogs_smoke
logger:
  level: INFO
  path: ./logs/cogs_smoke.log
caching:
  path: ./cache/
dataset:
  name: german
  path: ./dataset/german/
preprocess:
- name: scale
  seed: 0
  scaling: normalize
  range: true
- name: encode
  seed: 0
  encoding: onehot
- name: split
  seed: 0
  split: 0.2
model:
  name: mlp
  seed: 0
  device: cpu
  epochs: 50
  learning_rate: 0.01
  batch_size: 32
  layers: [64, 32]
  optimizer: adam
  criterion: cross_entropy
  output_activation: softmax
method:
  name: cogs
  seed: 0
  device: cpu
  population_size: 50
  n_generations: 10
  mutation_probability: inv_mutable_genotype_length
  num_features_mutation_strength: 0.25
  init_temperature: 0.8
  selection_name: tournament_2
  noisy_evaluations: false
  verbose: false
evaluation:
  - name: validity
  - name: distance
