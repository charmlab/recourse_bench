name: proplace_smoke
logger:
  level: INFO
  path: ./logs/proplace_smoke.log
caching:
  path: ./cache/
dataset:
  name: german
  path: ./dataset/german/
preprocess:
- name: scale
  seed: 0
  scaling: normalize
  range: true
- name: encode
  seed: 0
  encoding: onehot
- name: split
  seed: 0
  split: 0.2
  sample: 4
model:
  name: mlp
  seed: 0
  device: cpu
  epochs: 10
  learning_rate: 0.01
  batch_size: 32
  layers: [8]
  optimizer: adam
  criterion: cross_entropy
  output_activation: softmax
method:
  name: proplace
  seed: 0
  device: cpu
  delta: 0.03
  k: 5
  epsilon: 0.01
  solver_output: false
  solver_time_limit: 5
  convex_hull_prune: true
evaluation:
  - name: validity
  - name: distance
