name: face_smoke
logger:
  level: INFO
  path: ./logs/face_smoke.log
caching:
  path: ./cache/
dataset:
  name: german
  path: ./dataset/german/
preprocess:
- name: scale
  seed: 0
  scaling: normalize
  range: true
- name: encode
  seed: 0
  encoding: onehot
- name: split
  seed: 0
  split: 0.2
model:
  name: mlp
  seed: 0
  device: cpu
  epochs: 50
  learning_rate: 0.01
  batch_size: 32
  layers: [64, 32]
  optimizer: adam
  criterion: cross_entropy
  output_activation: softmax
method:
  name: face
  seed: 0
  device: cpu
  mode: kde
  epsilon: 0.5
  k_neighbors: 5
  weight_function: negative_log
evaluation:
  - name: validity
  - name: distance
