name: probe_smoke
logger:
  level: INFO
  path: ./logs/probe_smoke.log
caching:
  path: ./cache/
dataset:
  name: german
  path: ./dataset/german/
preprocess:
- name: scale
  seed: 0
  scaling: normalize
  range: true
- name: encode
  seed: 0
  encoding: onehot
- name: split
  seed: 0
  split: 0.2
model:
  name: mlp
  seed: 0
  device: cpu
  epochs: 50
  learning_rate: 0.01
  batch_size: 32
  layers: [64, 32]
  optimizer: adam
  criterion: cross_entropy
  output_activation: softmax
method:
  name: probe
  seed: 0
  device: cpu
  lr: 0.001
  lambda_: 0.01
  n_iter: 200
  max_minutes: 1.5
  norm: 1
  clamp: true
  loss_type: BCE
  y_target: [0.45, 0.55]
  binary_cat_features: true
  noise_variance: 0.01
  invalidation_target: 0.35
  inval_target_eps: 0.01
evaluation:
  - name: validity
  - name: distance
