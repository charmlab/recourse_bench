method:
  name: revise
  seed: 0
  device: auto
  desired_class: 1
  lambda_: 0.5
  optimizer: adam
  learning_rate: 0.1
  max_iter: 100
  binary_cat_features: true
  vae_layers: [512, 256, 8]
  vae_train: true
  vae_lambda_reg: 1.0e-6
  vae_epochs: 1
  vae_learning_rate: 1.0e-3
  vae_batch_size: 32

compatibility:
  allowed_models: [linear, mlp]
